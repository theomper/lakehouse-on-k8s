apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: data-processing
spec:
  # Headless service: clusterIP: None avoids declaring Service ports, which are
  # blocked by azurepolicy-k8sazurev1serviceallowedports. DNS resolution still
  # returns the pod IP directly, so Flink RPC (6123), blob server (6124) and
  # REST API (8081) all reach the JobManager pod-to-pod without port mapping.
  clusterIP: None
  selector:
    app: flink
    component: jobmanager
