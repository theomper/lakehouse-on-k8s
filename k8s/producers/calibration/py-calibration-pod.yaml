apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-calibration
  namespace: data-ingest
  labels:
    app: py-calibration
    component: simulator
spec:
  replicas: 1
  selector:
    matchLabels: { app: py-calibration }
  template:
    metadata:
      labels: { app: py-calibration, component: simulator }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: producer
        image: acrlakehouseonk8s01.azurecr.io/iot_sim_data_producer:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: KFK_BOOTSTRAP_SERVERS
            value: "kafka-0.kafka-svc.data-ingest.svc.cluster.local:9092,kafka-1.kafka-svc.data-ingest.svc.cluster.local:9092"
          - { name: PRODUCER_STREAM,    value: "both" }
          - { name: KFK_TOPIC_HOME,     value: "iot-sensor-general" }
          - { name: KFK_TOPIC_PLUG,     value: "iot-sensor-plug" }
          - { name: SIM_HOME_ID_START,  value: "1" }
          - { name: SIM_HOME_ID_END,    value: "PLACEHOLDER" }
          - { name: SIM_PLUGS_PER_HOME, value: "4" }
          - { name: SIM_SLEEP_SEC,      value: "1.0" }
        resources:
          requests: { cpu: "500m",  memory: "256Mi" }
          limits:   { cpu: "2",     memory: "1Gi" }
