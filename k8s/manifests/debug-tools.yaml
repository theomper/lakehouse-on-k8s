---
apiVersion: v1
kind: Namespace
metadata:
  name: debug-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netshoot
  namespace: debug-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netshoot
  template:
    metadata:
      labels:
        app: netshoot
    spec:
      nodeSelector:
        agentpool: userpool
      containers:
      - name: netshoot
        image: nicolaka/netshoot:latest
        command: ["/bin/bash", "-c", "--"]
        args: ["while true; do sleep 30; done;"]
        tty: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-debug
  namespace: debug-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-debug
  template:
    metadata:
      labels:
        app: kafka-debug
    spec:
      nodeSelector:
        agentpool: userpool
      containers:
      - name: kafka-debug
        image: edenhill/kcat:1.7.1
        command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: kafka-tools
  namespace: data-ingest
spec:
  restartPolicy: Never
  containers:
    - name: ktools
      image: bitnami/kafka:3.6.1
      command: ["sleep","infinity"]
