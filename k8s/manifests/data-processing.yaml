apiVersion: batch/v1
kind: CronJob
metadata:
  name: thirtymin-aggregation
  namespace: data-processing
spec:
  # Auto-schedule disabled by design: this template is invoked once per
  # experiment sub-phase by the orchestrator (Invoke-30minAggregation) via
  # `kubectl create job --from=cronjob/thirtymin-aggregation`. The schedule
  # below is a placeholder so the CronJob object validates; it will never fire
  # while suspend: true.
  suspend: true
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: sql-client
            image: acrlakehouseonk8s01.azurecr.io/flink-paimon-kafka:latest
            imagePullPolicy: Always
            env:
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secret
                  key: storage-account-key
            command: ["/bin/bash","-lc"]
            args:
              - |
                set -o pipefail
                /opt/flink/bin/sql-client.sh embedded \
                  -Drest.address=flink-jobmanager \
                  -Drest.port=8081 \
                  -Dparallelism.default=2 \
                  -Dtable.local-time-zone=UTC \
                  -Dexecution.runtime-mode=batch \
                  -Dexecution.attached=true \
                  -Dfs.azure.account.key.stlakehouseonk8s01.dfs.core.windows.net=$AZURE_STORAGE_ACCOUNT_KEY \
                  -Dazure.account-key=$AZURE_STORAGE_ACCOUNT_KEY \
                  -i /sql/init.sql \
                  -f /sql/thirtymin.sql
                rc=$?
                if [ $rc -ne 0 ]; then
                  echo "==================== sql-client failed (rc=$rc); dumping log ===================="
                  for f in /opt/flink/log/flink-*-sql-client-*.log /opt/flink/log/flink--sqlclient-*.log /opt/flink/log/*.log; do
                    [ -f "$f" ] || continue
                    echo "--- $f ---"
                    cat "$f"
                  done
                  exit $rc
                fi
            volumeMounts:
            - name: init
              mountPath: /sql/init.sql
              subPath: init.sql
            - name: sql
              mountPath: /sql/thirtymin.sql
              subPath: thirtymin.sql
          volumes:
          - name: init
            configMap:
              name: sql-session-init
          - name: sql
            configMap:
              name: thirtymin-aggregation-sql
