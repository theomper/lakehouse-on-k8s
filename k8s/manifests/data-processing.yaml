---
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-submit-kafka-to-paimon
  namespace: data-processing
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sql-client
        image: acrlakehouseonk8s01.azurecr.io/flink-paimon-kafka:latest
        imagePullPolicy: Always
        env:
        - name: AZURE_STORAGE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: azure-storage-secret
              key: storage-account-key
        command: ["/bin/bash","-lc"]
        args:
          - |
            set -o pipefail
            /opt/flink/bin/sql-client.sh embedded \
              -Drest.address=flink-jobmanager \
              -Drest.port=8081 \
              -Dparallelism.default=4 \
              -Dtable.exec.resource.default-parallelism=4 \
              -Dexecution.checkpointing.dir=abfs://checkpoints@stlakehouseonk8s01.dfs.core.windows.net/flink-checkpoints \
              -Dexecution.runtime-mode=streaming \
              -Dexecution.checkpointing.mode=EXACTLY_ONCE \
              -Dexecution.checkpointing.interval=60s \
              -Dexecution.checkpointing.timeout=120s \
              -Dexecution.checkpointing.unaligned=false \
              -Dexecution.checkpointing.tolerable-failed-checkpoints=5 \
              -Dfs.azure.account.key.stlakehouseonk8s01.dfs.core.windows.net=$AZURE_STORAGE_ACCOUNT_KEY \
              -Dazure.account-key=$AZURE_STORAGE_ACCOUNT_KEY \
              -i /sql/init.sql \
              -f /sql/ingest.sql
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "==================== sql-client failed (rc=$rc); dumping log ===================="
              for f in /opt/flink/log/flink-*-sql-client-*.log /opt/flink/log/flink--sqlclient-*.log /opt/flink/log/*.log; do
                [ -f "$f" ] || continue
                echo "--- $f ---"
                cat "$f"
              done
              exit $rc
            fi
        volumeMounts:
        - name: init
          mountPath: /sql/init.sql
          subPath: init.sql
        - name: sql
          mountPath: /sql/ingest.sql
          subPath: ingest.sql
      volumes:
      - name: init
        configMap:
          name: sql-session-init
      - name: sql
        configMap:
          name: kafka-to-paimon-sql
---
