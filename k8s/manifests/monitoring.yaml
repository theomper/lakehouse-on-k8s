apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# Provision a Grafana data source that points to the Trino Helm release
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-trino
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  trino-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Trino
        uid: PD73EC80E50767796
        type: trino-datasource
        access: proxy
        url: http://trino-standalone-trino.analytics.svc.cluster.local:8080
        orgId: 1
        isDefault: false
        editable: false
        jsonData:
          catalog: paimon
          schema: iot
